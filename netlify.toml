# Netlify 部署配置 — MovieHub
# 构建命令 & 输出目录
[build]
  command = "npm install --legacy-peer-deps --no-package-lock && npm run build"
  publish = "docs"

# 环境变量（可选：固定 Node 版本）
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps --no-package-lock"

# 路由重写：
#  1. /api/proxy → Netlify Function
#  2. SPA fallback：其他所有非静态资源 → index.html
[[redirects]]
  from = "/api/proxy"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/api/proxy/*"
  to = "/.netlify/functions/proxy"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {
    Role = ["*"],
    # 不匹配已有文件 & API 路由
    Language = ["!"]
  }

[[headers]]
  for = "/api/proxy"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Cache-Control = "public, max-age=15, s-maxage=30"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
